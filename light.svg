<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="shimmerLight" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#0969da" />
      <stop offset="100%" stop-color="#cbd5e1">
        <animate attributeName="offset" values="0;1;0" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="asciiGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#2563eb;#0284c7" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#2563eb">
        <animate attributeName="stop-color" values="#2563eb;#7c3aed;#2563eb" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#0284c7;#7c3aed" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="glassReflectLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="glowPulseLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.12">
        <animate attributeName="stop-opacity" values="0.12;0.25;0.12" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>

    <filter id="glowLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pillGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="clipType1Light">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0;280;280;0" keyTimes="0;0.3;0.8;1" dur="16s" begin="0s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clipType2Light">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0;0;280;280;0" keyTimes="0;0.25;0.55;0.8;1" dur="16s" begin="4s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clipType3Light">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0;0;280;280;0" keyTimes="0;0.25;0.55;0.8;1" dur="16s" begin="8s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clipType4Light">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0;0;280;280;0" keyTimes="0;0.25;0.55;0.8;1" dur="16s" begin="12s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');
    .font-code { font-family: 'Fira Code', 'Courier New', Courier, monospace; }
    .pill { transition: all 0.3s ease; cursor: pointer; }
    .pill:hover { transform: scale(1.06); filter: url(#pillGlowLight); }
    .social-icon { transition: all 0.3s ease; fill: #64748b; }
    .social-icon:hover { fill: #0969da; transform: translateY(-2px); filter: url(#glowLight); }
  </style>

